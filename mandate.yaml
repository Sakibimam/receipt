# The limits the demo agent must stay inside. Embedded in every receipt with its hash.
name: research-brief-v1
allowed_models:
  - openai/gpt-oss-120b                     # researcher
  - alibaba/qwen3-235b-a22b-instruct-2507   # summarizer
  - receipt-research                         # Otari routing policy (fallback), if configured
allowed_tools:
  - otari_web_search
  - otari_code_execution
blocked_tools:
  - otari_web_fetch
budget_usd: 0.06                # ~$0.01 per web search + $0.01 sandbox; run A ≈ $0.04
max_requests: 12
end_user: demo-analyst
end_user_budget: receipt-demo
enforce: true
require_sourced_citations: true   # every cited URL must come from an Otari web search result
